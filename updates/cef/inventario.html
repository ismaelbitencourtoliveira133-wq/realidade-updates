<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --slot:#484848;--slot-edge:#8a8a8a;--panel:#4a4a4a;--line:#6e6e6e;
  --text:#f2f2f2;--muted:#9a9a9a;--accent:#3d5fd6;--w:80px;--h:96px;--gap:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:transparent;
  font-family:'Montserrat',system-ui,sans-serif;
  color:var(--text);
  user-select:none;-webkit-user-select:none;
}
#stage{
  position:fixed;left:50%;top:50%;
  width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--s,1));
  transform-origin:center center;
  display:flex;align-items:center;justify-content:center;
}
.app{
  display:grid;
  grid-template-columns:auto 130px auto;
  gap:48px;align-items:start;
  position:relative;
}
.close{
  position:absolute;top:-64px;right:0;
  width:auto;height:40px;padding:0 16px;gap:12px;
  font:700 11px 'Montserrat',sans-serif;color:#fff;letter-spacing:.04em;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .12s,border-color .12s;
}
.close svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:square}
.close:hover{background:rgba(61,95,214,.35);border-color:var(--accent)}
.close:active{transform:translateY(1px)}
.title{
  display:flex;align-items:center;gap:14px;
  font-size:13px;font-weight:700;margin-bottom:12px;
}
.title::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(5,var(--w));gap:var(--gap)}
.scroll{overflow-y:auto;overflow-x:hidden;padding-right:12px;scrollbar-width:thin;scrollbar-color:var(--accent) #6c6c6c}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-track{background:#6c6c6c}
.scroll::-webkit-scrollbar-thumb{background:var(--accent)}
#bag-wrap{height:calc(var(--h)*3.55 + var(--gap)*3)}
#ground-wrap{height:calc(var(--h)*5 + var(--gap)*4)}
.col section+section{margin-top:20px}
.slot{
  position:relative;width:var(--w);height:var(--h);
  background:radial-gradient(circle at 50% 50%,#5a5a5a 0%,var(--slot) 70%);
  border:2px solid var(--slot-edge);
  outline:1px solid #5b5b5b;outline-offset:-4px;
  cursor:pointer;transition:border-color .12s,background .12s;
  display:flex;align-items:center;justify-content:center;
}
.slot.has{touch-action:none;cursor:grab}
.slot:hover{border-color:#b5b5b5}
.slot.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),inset 0 0 18px rgba(61,95,214,.35)}
.slot.over{border-color:#fff;background:#666}
.slot.dragging{opacity:.35}
.slot .key{font-size:38px;font-weight:600;color:#6d6d6d;pointer-events:none}
.slot.has .key{position:absolute;top:4px;left:7px;font-size:12px;color:var(--muted)}
.slot .icon{width:60px;height:60px;object-fit:contain;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.slot .ph{
  width:56px;height:56px;display:flex;align-items:center;justify-content:center;
  background:#3a3a3a;border:1px dashed #777;color:#bbb;font-weight:700;font-size:16px;pointer-events:none;
}
.slot .name{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10px;font-weight:600;color:#ddd;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.slot .qty{position:absolute;top:5px;right:7px;font-size:12px;font-weight:700;color:#fff;pointer-events:none}
.slot .kg{position:absolute;top:5px;left:7px;font-size:10px;color:var(--muted);pointer-events:none}
#hotbar .slot.has .kg{display:none}
.weight{margin-top:12px}
.bar{height:3px;background:#6c6c6c}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.wrow{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;font-weight:700}
.wrow>span:last-child{color:var(--muted)}
.wrow b{color:var(--text)}
.mid{padding-top:calc(var(--h)+50px);display:flex;flex-direction:column;gap:8px}
.mid h3{font-size:12px;font-weight:700;text-align:center;margin-bottom:8px}
.btn,.qtd{
  height:52px;background:var(--panel);border:1px solid #5d5d5d;
  display:flex;align-items:center;gap:14px;
  font:700 11px 'Montserrat',sans-serif;color:#a5a5a5;
}
.qtd input{width:100%;height:100%;background:transparent;border:0;outline:0;text-align:center;font:600 13px 'Montserrat',sans-serif;color:#c8c8c8;-moz-appearance:textfield}
.qtd input::-webkit-outer-spin-button,.qtd input::-webkit-inner-spin-button{-webkit-appearance:none}
.qtd input::placeholder{color:#8a8a8a}
.qtd:focus-within{border-color:var(--accent)}
.btn{cursor:pointer;padding:0 16px;transition:background .12s,color .12s}
.btn:hover,.btn.over{background:#5c5c5c;color:#fff;border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px;fill:var(--accent);flex:none}
.btn .sep{width:1px;height:22px;background:#666}
.btn .t{flex:1;text-align:center;padding-right:20px}
.ghost{
  position:absolute;left:0;top:0;width:var(--w);height:var(--h);
  pointer-events:none;z-index:50;opacity:.92;
  background:rgba(72,72,72,.85);border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);
}
.ghost .icon{width:68px;height:68px;object-fit:contain}
.ghost .qty{position:absolute;top:5px;right:7px;font-size:12px;font-weight:700}
#toast{
  position:absolute;left:50%;bottom:60px;transform:translate(-50%,20px);
  background:#2b2b2b;color:#eee;border-left:3px solid var(--accent);
  padding:12px 22px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.2s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="stage">
  <main class="app">
    <button class="close" id="btn-close" aria-label="Fechar inventário" title="Fechar (Esc)">
      <span>FECHAR</span>
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>
    <div class="col left">
      <section>
        <div class="title">HOTBAR</div>
        <div class="grid" id="hotbar"></div>
      </section>
      <section>
        <div class="title">MOCHILA</div>
        <div class="scroll" id="bag-wrap"><div class="grid" id="bag"></div></div>
        <div class="weight">
          <div class="bar"><i id="wbar"></i></div>
          <div class="wrow"><span>PESO</span><span><b id="wnow">0</b>/<span id="wmax">100</span>KG</span></div>
        </div>
      </section>
    </div>
    <div class="mid">
      <h3>QUANTIDADE</h3>
      <label class="qtd"><input id="qty" type="number" min="0" placeholder="Tudo" inputmode="numeric" aria-label="Quantidade"></label>
      <button class="btn" data-act="use"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v6c0 5 3.8 8.7 9 9 5.2-.3 9-4 9-9V7z"/></svg><i class="sep"></i><span class="t">USAR</span></button>
      <button class="btn" data-act="send"><svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg><i class="sep"></i><span class="t">ENVIAR</span></button>
      <button class="btn" data-act="trash"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7zM9 3h6l1 2h4v2H4V5h4z"/></svg><i class="sep"></i><span class="t">LIXO</span></button>
    </div>
    <div class="col right">
      <section>
        <div class="title">CHÃO</div>
        <div class="scroll" id="ground-wrap"><div class="grid" id="ground"></div></div>
      </section>
    </div>
  </main>
  <div id="toast" role="status"></div>
</div>
<script>
const SIZES={hotbar:5,bag:30,ground:30};
let MAX_WEIGHT=100;
let ITEMS={};

const state={
  hotbar:Array(SIZES.hotbar).fill(null),
  bag:Array(SIZES.bag).fill(null),
  ground:Array(SIZES.ground).fill(null),
};

let selected=null;
const $=s=>document.querySelector(s);
const qtyInput=$('#qty');

/* ---------- bridge Android ---------- */
function postBridge(event,data){
  if(window.InventarioBridge){
    try{ window.InventarioBridge.onAction(event,JSON.stringify(data||{})); }catch(e){}
  }
}

/* Notifica a hotbar.html sempre que a faixa hotbar mudar */
function syncHotbar(){
  const payload = JSON.stringify({
    hotbar: state.hotbar.map((s,i) => s
      ? {slot:i+1, item:s.id, amount:s.qty, weapon:s.weapon||0}
      : {slot:i+1, item:null, amount:0, weapon:0}
    )
  });
  if(window.HotbarBridge){
    try{ window.HotbarBridge.onInventarioSync(payload); }catch(e){}
  }
  postBridge('hotbar_sync', {hotbar: state.hotbar});
}

/* Chamado pelo Java com os dados do servidor */
window.carregarInventario=function(json){
  try{ load(JSON.parse(json)); }catch(e){}
};

/* ---------- escala automática (base 1920x1080) ---------- */
function fit(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  document.documentElement.style.setProperty('--s',s);
}
addEventListener('resize',fit);
fit();

/* ---------- utilitários ---------- */
const fmt=n=>n>=1000?n.toLocaleString('pt-BR'):String(n);
const def=id=>ITEMS[id]||{label:id,weight:0,usable:false,image:''};
const wOf=s=>s?def(s.id).weight*s.qty:0;
const carried=()=>[...state.hotbar,...state.bag].reduce((a,s)=>a+wOf(s),0);
const isCarry=c=>c!=='ground';

function amount(stack){
  const v=parseInt(qtyInput.value,10);
  return(!v||v<=0)?stack.qty:Math.min(v,stack.qty);
}

let toastTimer;
function toast(msg){
  const t=$('#toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

window.phFallback=img=>{
  const ph=document.createElement('span');
  ph.className='ph';
  ph.textContent=(img.alt||'?').slice(0,2).toUpperCase();
  img.replaceWith(ph);
};

const iconHTML=id=>{
  const it=def(id);
  if(it.image) return`<img class="icon" src="${it.image}" alt="${it.label}" draggable="false" onerror="phFallback(this)">`;
  const s=document.createElement('span');s.className='ph';
  s.textContent=(it.label||id).slice(0,2).toUpperCase();
  return s.outerHTML;
};

/* ---------- load ---------- */
function load(d){
  if(d.maxWeight) MAX_WEIGHT=d.maxWeight;
  if(d.items) ITEMS=d.items;
  ['hotbar','bag','ground'].forEach(c=>{
    state[c]=Array(SIZES[c]).fill(null);
    (d[c]||[]).forEach(o=>{
      if(o.slot>=1&&o.slot<=SIZES[c])
        state[c][o.slot-1]={id:o.item,qty:o.amount};
    });
  });
  selected=null;
  render();
}

/* ---------- render ---------- */
function build(c){
  const el=$('#'+c);el.innerHTML='';
  for(let i=0;i<SIZES[c];i++){
    const d=document.createElement('div');
    d.className='slot';d.dataset.c=c;d.dataset.i=i;
    el.appendChild(d);
  }
}

function paint(c){
  const el=$('#'+c);
  state[c].forEach((s,i)=>{
    const d=el.children[i];
    d.classList.toggle('has',!!s);
    d.classList.toggle('selected',!!selected&&selected.c===c&&selected.i===i);
    let h='';
    if(c==='hotbar') h+=`<span class="key">${i+1}</span>`;
    if(s){
      const it=def(s.id);
      h+=iconHTML(s.id);
      if(s.qty>1) h+=`<span class="qty">${fmt(s.qty)}x</span>`;
      if(c!=='hotbar') h+=`<span class="kg">${(it.weight*s.qty).toFixed(1)}kg</span>`;
      h+=`<span class="name">${it.label}</span>`;
    }
    d.innerHTML=h;
  });
}

function render(){
  ['hotbar','bag','ground'].forEach(paint);
  const w=carried();
  $('#wnow').textContent=Math.round(w);
  $('#wmax').textContent=MAX_WEIGHT;
  $('#wbar').style.width=Math.min(100,w/MAX_WEIGHT*100)+'%';
}

/* ---------- mover ---------- */
function move(fc,fi,tc,ti){
  const from=state[fc][fi];
  if(!from||(fc===tc&&fi===ti)) return;
  const to=state[tc][ti];
  const n=amount(from);
  const whole=n===from.qty;
  if(isCarry(tc)&&!isCarry(fc)&&carried()+def(from.id).weight*n>MAX_WEIGHT+1e-9){
    toast('Mochila cheia: peso máximo atingido');return;
  }
  if(!to){
    if(whole){state[tc][ti]=from;state[fc][fi]=null;}
    else{from.qty-=n;state[tc][ti]={id:from.id,qty:n};}
  }else if(to.id===from.id){
    to.qty+=n;from.qty-=n;
    if(from.qty<=0) state[fc][fi]=null;
  }else if(whole){
    state[tc][ti]=from;state[fc][fi]=to;
    if(carried()>MAX_WEIGHT+1e-9){
      state[tc][ti]=to;state[fc][fi]=from;
      toast('Mochila cheia: peso máximo atingido');return;
    }
  }else{toast('Destino ocupado por outro item');return;}
  postBridge('move',{from:{container:fc,slot:fi+1},to:{container:tc,slot:ti+1},amount:n});
  selected=null;render();
  if(fc==='hotbar'||tc==='hotbar') syncHotbar();
}

/* ---------- ações ---------- */
function act(kind){
  const s=selected&&state[selected.c][selected.i];
  if(!s){toast('Selecione um item primeiro');return;}
  const it=def(s.id);
  if(kind==='use'&&!it.usable){toast(it.label+' não pode ser usado');return;}
  const n=kind==='use'?1:amount(s);
  postBridge(kind,{container:selected.c,slot:selected.i+1,item:s.id,amount:n});
  s.qty-=n;
  if(s.qty<=0){state[selected.c][selected.i]=null;selected=null;}
  toast(kind==='use'?`Você usou ${it.label}`:
        kind==='send'?`Enviado: ${n}x ${it.label}`:
                      `Descartado: ${n}x ${it.label}`);
  render();
  if(selected && selected.c==='hotbar') syncHotbar();
}

document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));

/* ---------- fechar ---------- */
function closeInventory(){
  selected=null;render();
  if(window.InventarioBridge){
    try{ window.InventarioBridge.fechar(); }catch(e){}
  }
}

$('#btn-close').addEventListener('click',closeInventory);

/* ---------- arrastar ---------- */
let press=null,drag=null;
const getScale=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||1;

function clickSlot(c,i){
  const s=state[c][i];
  if(selected){
    if(selected.c===c&&selected.i===i){selected=null;render();return;}
    move(selected.c,selected.i,c,i);return;
  }
  if(s){selected={c,i};render();}
}

function startDrag(){
  const s=state[press.c][press.i];
  const g=document.createElement('div');
  g.className='ghost';
  g.innerHTML=iconHTML(s.id)+(s.qty>1?`<span class="qty">${fmt(amount(s))}x</span>`:'');
  $('#stage').appendChild(g);
  drag={ghost:g};
  $('#'+press.c).children[press.i].classList.add('dragging');
}

function moveGhost(e){
  const r=$('#stage').getBoundingClientRect();
  const sc=getScale();
  drag.ghost.style.left=(e.clientX-r.left)/sc+'px';
  drag.ghost.style.top=(e.clientY-r.top)/sc+'px';
  document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const target=t&&(t.closest('.slot')||t.closest('.btn'));
  if(target) target.classList.add('over');
}

function endDrag(){
  if(drag) drag.ghost.remove();
  document.querySelectorAll('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'));
  drag=null;press=null;
}

document.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  const sl=e.target.closest('.slot');
  if(!sl) return;
  press={c:sl.dataset.c,i:+sl.dataset.i,x:e.clientX,y:e.clientY,id:e.pointerId};
});

document.addEventListener('pointermove',e=>{
  if(!press||e.pointerId!==press.id) return;
  if(!drag){
    if(!state[press.c][press.i]) return;
    if(Math.hypot(e.clientX-press.x,e.clientY-press.y)<6) return;
    startDrag();
  }
  moveGhost(e);
});

document.addEventListener('pointerup',e=>{
  if(!press||e.pointerId!==press.id) return;
  const{c,i}=press;
  if(drag){
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const sl=t&&t.closest('.slot');
    const btn=t&&t.closest('.btn');
    endDrag();
    if(sl) move(c,i,sl.dataset.c,+sl.dataset.i);
    else if(btn){selected={c,i};act(btn.dataset.act);}
  }else{press=null;clickSlot(c,i);}
});

document.addEventListener('pointercancel',endDrag);
document.addEventListener('contextmenu',e=>e.preventDefault());

/* clique duplo */
document.addEventListener('dblclick',e=>{
  const sl=e.target.closest('.slot');
  if(!sl) return;
  const c=sl.dataset.c,i=+sl.dataset.i,s=state[c][i];
  if(!s) return;
  if(c==='ground'){
    let idx=state.bag.findIndex(x=>x&&x.id===s.id);
    if(idx<0) idx=state.bag.findIndex(x=>!x);
    if(idx>=0) move(c,i,'bag',idx);else toast('Mochila sem espaço');
  }else{selected={c,i};act('use');}
});

/* teclado */
document.addEventListener('keydown',e=>{
  if(e.target===qtyInput) return;
  if(/^[1-5]$/.test(e.key)&&state.hotbar[+e.key-1]){selected={c:'hotbar',i:+e.key-1};act('use');}
  if(e.key==='Delete') act('trash');
  if(e.key==='Escape'){
    if(selected){selected=null;render();}
    else closeInventory();
  }
});

/* ---------- início ---------- */
['hotbar','bag','ground'].forEach(build);
render();
</script>
</body>
</html>
